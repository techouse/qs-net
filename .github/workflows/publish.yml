name: Publish to NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  publish:
    needs: test
    name: Publish
    permissions:
      contents: read
      id-token: write
    environment: nuget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get package version
        id: get_version
        run: |
          set -e
          VERSION=$(awk -F'[<>]' '/^[[:space:]]*<QsNetPackageVersion>/ {print $3}' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build & Pack
        run: |
          dotnet pack src/QsNet/QsNet.csproj -c Release -o ./artifacts
          dotnet pack src/QsNet.AspNetCore/QsNet.AspNetCore.csproj -c Release -o ./artifacts
          dotnet pack src/QsNet.Flurl/QsNet.Flurl.csproj -c Release -o ./artifacts
          dotnet pack src/QsNet.Refit/QsNet.Refit.csproj -c Release -o ./artifacts
          dotnet pack src/QsNet.RestSharp/QsNet.RestSharp.csproj -c Release -o ./artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/QsNet.$VERSION.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/QsNet.AspNetCore.$VERSION.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/QsNet.Flurl.$VERSION.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/QsNet.Refit.$VERSION.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./artifacts/QsNet.RestSharp.$VERSION.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: QsNet.${{ env.VERSION }}
          path: |
            ./artifacts/QsNet.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.AspNetCore.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.AspNetCore.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.Flurl.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.Flurl.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.Refit.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.Refit.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.RestSharp.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.RestSharp.${{ env.VERSION }}.snupkg
          retention-days: 7
  release:
    needs:
      - test
      - publish
    name: Github Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Get package version
        id: get_version
        run: |
          set -e
          VERSION=$(awk -F'[<>]' '/^[[:space:]]*<QsNetPackageVersion>/ {print $3}' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: QsNet.${{ env.VERSION }}
          path: ./artifacts
      - name: Create tag-specific CHANGELOG
        id: create_changelog
        run: |
          set -e
          CHANGELOG_PATH=$RUNNER_TEMP/CHANGELOG.md
          awk '/^##[[:space:]].*/ { if (count == 1) exit; count++; print } count == 1 && !/^##[[:space:]].*/ { print }' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > $CHANGELOG_PATH
          echo -en "\n[https://www.nuget.org/packages/QsNet](https://www.nuget.org/packages/QsNet)" >> $CHANGELOG_PATH
          echo -en "\n[https://www.nuget.org/packages/QsNet.AspNetCore](https://www.nuget.org/packages/QsNet.AspNetCore)" >> $CHANGELOG_PATH
          echo -en "\n[https://www.nuget.org/packages/QsNet.Flurl](https://www.nuget.org/packages/QsNet.Flurl)" >> $CHANGELOG_PATH
          echo -en "\n[https://www.nuget.org/packages/QsNet.Refit](https://www.nuget.org/packages/QsNet.Refit)" >> $CHANGELOG_PATH
          echo -en "\n[https://www.nuget.org/packages/QsNet.RestSharp](https://www.nuget.org/packages/QsNet.RestSharp)" >> $CHANGELOG_PATH
          echo "CHANGELOG_PATH=$CHANGELOG_PATH" >> $GITHUB_ENV
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          body_path: ${{ env.CHANGELOG_PATH }}
          files: |
            ./artifacts/QsNet.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.AspNetCore.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.AspNetCore.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.Flurl.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.Flurl.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.Refit.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.Refit.${{ env.VERSION }}.snupkg
            ./artifacts/QsNet.RestSharp.${{ env.VERSION }}.nupkg
            ./artifacts/QsNet.RestSharp.${{ env.VERSION }}.snupkg
      - name: Clean up
        id: clean_up
        if: ${{ always() }}
        run: |
          rm -rf $CHANGELOG_PATH
          rm -rf ./artifacts/*.nupkg
          rm -rf ./artifacts/*.snupkg
  docs:
    uses: ./.github/workflows/docs.yml
    secrets: inherit
    needs:
      - test
      - publish
    permissions:
      contents: write
